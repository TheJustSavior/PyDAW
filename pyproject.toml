[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "pydaw"
version = "0.1.1"
description = "PyDAW - Digital Audio Workstation (Python UI + C++ engine)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<6.9",
    "numpy>=1.26,<2.0",
    "soundfile>=0.13,<0.14",
]

[project.gui-scripts]
pydaw = "pydaw.app:main"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["pydaw"]
cmake.build-type = "Release"
